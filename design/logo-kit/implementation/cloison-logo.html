<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo Cloison — snippet d'intégration</title>
<!-- 1. Charger la police (une fois, dans le <head> de votre site) -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/* 2. Styles du logo — copier tel quel */
.cloison-logo{display:inline-flex;align-items:center;gap:.08em;font-family:'Archivo Black',sans-serif;color:#141414;font-size:32px;line-height:1;text-decoration:none;user-select:none}
.cloison-logo .bar{display:inline-block;width:.32em;height:1.25em;background:#ffd23f;border:.07em solid #141414;border-radius:.16em;transform:rotate(6deg);margin:0 .08em}
/* Variantes */
.cloison-logo--inverse{color:#fff6e8}.cloison-logo--inverse .bar{border-color:#fff6e8}
.cloison-logo--blanc{color:#fff}
/* Démo uniquement */
body{margin:0;font-family:sans-serif;background:#fff6e8;padding:40px;display:flex;flex-direction:column;gap:32px;align-items:flex-start}
.demo{padding:24px 32px;border-radius:12px}
</style>
</head>
<body>
<!-- 3. Le logo : la taille se règle uniquement via font-size -->
<div class="demo">
  <a class="cloison-logo" href="/" aria-label="Cloison">CLOI<span class="bar"></span>SON</a>
</div>
<div class="demo" style="background:#141414">
  <a class="cloison-logo cloison-logo--inverse" href="/" aria-label="Cloison">CLOI<span class="bar"></span>SON</a>
</div>
<div class="demo" style="background:#2b3ef0">
  <a class="cloison-logo cloison-logo--blanc" href="/" aria-label="Cloison" style="font-size:48px">CLOI<span class="bar"></span>SON</a>
</div>
<div class="demo" style="background:#fff">
  <a class="cloison-logo" href="/" aria-label="Cloison" style="font-size:16px">CLOI<span class="bar"></span>SON</a>
</div>
</body>
</html>
