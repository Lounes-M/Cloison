name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Declenchement manuel. Necessaire, et pas seulement pratique : les commits
  # pousses par une application GitHub ne declenchent pas de workflow, donc une
  # PR ouverte par un agent n'a aucune verification tant qu'on ne la lance pas.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Format · Typo · Tests · Build · Secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Ni emoji ni tiret cadratin, nulle part. Ne demande pas de build : c'est
      # une lecture de fichiers, elle passe donc avant l'etape la plus lente.
      - name: Typographie
        run: npm run check:typo

      # Les tests tournent avant le build : ils portent sur les regles d'acces,
      # et rien ne sert de construire une application dont le cloisonnement a
      # cede. PGlite embarque Postgres, aucun service a demarrer ici.
      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Session MFA via Next et SDK reels
        run: node scripts/verifier-session-mfa-http.mjs

      # Rejoue apres le build : c'est la seule etape ou les fichiers servis au
      # navigateur existent, donc la seule ou une fuite reelle peut etre vue.
      - name: Fuites dans le bundle client
        run: npm run check:env

  postgrest:
    name: PostgreSQL et PostgREST HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: cloison-test-only
          POSTGRES_DB: cloison_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Preparer le schema avant de demarrer PostgREST
        env:
          PGTEST_URL: postgres://postgres:cloison-test-only@127.0.0.1:5432/cloison_audit_test
          POSTGREST_TEST_URL: http://127.0.0.1:3001
          POSTGREST_TEST_SECRET: local-isolated-postgrest-tests-32-characters-only
        run: node scripts/test-postgrest.mjs --preparer
      - name: Demarrer PostgREST avec son role deja cree
        run: |
          docker run --detach --name cloison-postgrest --network host \
            --env PGRST_DB_URI=postgres://authenticator:cloison-test-only@127.0.0.1:5432/cloison_audit_test \
            --env PGRST_DB_SCHEMAS=public --env PGRST_DB_ANON_ROLE=anon \
            --env PGRST_SERVER_PORT=3001 \
            --env PGRST_JWT_SECRET=local-isolated-postgrest-tests-32-characters-only \
            postgrest/postgrest:v16.2
      - name: Build pour les parcours HTTP authentifies
        run: npm run build
      - name: Parcours porteurs via Next et PostgREST reels
        env:
          PGTEST_URL: postgres://postgres:cloison-test-only@127.0.0.1:5432/cloison_audit_test
          POSTGREST_TEST_URL: http://127.0.0.1:3001
          POSTGREST_TEST_SECRET: local-isolated-postgrest-tests-32-characters-only
        run: node scripts/essai-parcours-local.mjs
      - name: Revocation et droits via HTTP
        env:
          PGTEST_URL: postgres://postgres:cloison-test-only@127.0.0.1:5432/cloison_audit_test
          POSTGREST_TEST_URL: http://127.0.0.1:3001
          POSTGREST_TEST_SECRET: local-isolated-postgrest-tests-32-characters-only
        run: node scripts/test-postgrest.mjs
      - name: Diagnostic PostgREST
        if: failure()
        run: docker logs cloison-postgrest || true
