name: Maintenance
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-production
  cancel-in-progress: false
jobs:
  reprise:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Purge physique et reprise des courriels
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/executer-maintenance.mjs
