name: Secrets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  historique:
    name: Historique sans secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer le scanner verifie
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          mkdir -p scanner
          tar -xzf gitleaks.tar.gz -C scanner gitleaks
      - name: Rechercher dans tout l historique disponible
        shell: bash
        run: |
          git fetch --no-tags origin 'refs/pull/*/head:refs/remotes/audit-pr/*'
          "$RUNNER_TEMP/scanner/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner
