name: Supervision
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: supervision-production
  cancel-in-progress: false
jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Compteurs agreges et anomalies a examiner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/executer-supervision.mjs
      - name: Derive du schema de production
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/verifier-schema-distant.mjs
      - name: Maintenance recente confirmee
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/verifier-cadence.mjs
      - name: Verification fournisseur des paiements
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/rapprocher-paiements.mjs
      - name: Rapprochement des paiements
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/verifier-paiements.mjs
