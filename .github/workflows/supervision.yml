name: Supervision
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supervision-production
  cancel-in-progress: false
jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Compteurs agreges et anomalies a examiner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/executer-supervision.mjs
