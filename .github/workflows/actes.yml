name: Traitement des actes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traitement-actes-production
  cancel-in-progress: false
jobs:
  traitement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Rapprochement, archivage, conservation et reglements
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/traiter-actes.mjs
